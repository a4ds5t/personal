name = "personal"
main = "src/index.ts"
compatibility_date = "2025-04-01"
workers_dev = false
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"
# Root `/` must hit the Worker for Accept-Language / cookie / ?lang= redirects.
# Legacy regional paths redirect to short language codes in the Worker.
# Locale HTML and static assets stay asset-first.
run_worker_first = [
  "/",
  "/nl-NL",
  "/nl-NL/*",
  "/es-419",
  "/es-419/*",
  "/zh-Hans",
  "/zh-Hans/*",
]

[[routes]]
pattern = "a4ds5t.soholocal.nl"
custom_domain = true

[observability]
enabled = true
